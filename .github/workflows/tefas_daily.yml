name: Process TEFAS Excel to JSON

on:
  push:
    paths:
      - 'data/*.xlsx'   # data klasörüne yeni bir .xlsx dosyası geldiğinde çalışır
  workflow_dispatch:      # İstendiğinde manuel butonla da çalıştırılabilir

permissions:
  contents: write

jobs:
  convert-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: pip install pandas openpyxl

      - name: Excel Dosyasını JSON'a Dönüştür
        run: python scripts/parse_excel.py

      - name: Üretilen JSON Dosyasını Commit Et ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_funds.json
          git commit -m "chore: auto-generate latest_funds.json from uploaded excel" || echo "No changes to commit"
          git push